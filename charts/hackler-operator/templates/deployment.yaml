apiVersion: apps/v1
kind: Deployment
metadata:
  name: hackler-operator
  namespace: {{ .Release.Namespace }}
  labels: {{- include "hackler.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Never two operators at once: they would race for the same machines.
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: hackler-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels: {{- include "hackler.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: hackler-operator
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: operator
          image: {{ include "hackler.operatorImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef: { name: hackler-operator }
            # Until the Secret exists the pod waits (CreateContainerConfigError).
            - secretRef: { name: {{ .Values.token.secretName }} }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources: {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
