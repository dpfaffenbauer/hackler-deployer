# Lints and renders the chart and the Kustomize base on every push; a tag
# chart-v<version> (matching Chart.yaml's version) publishes the chart to
# oci://ghcr.io/<owner>/charts/hackler-operator.
name: Chart

on:
  push:
    branches: [main]
    tags: ["chart-v*"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render
        run: |
          helm lint charts/hackler-operator
          helm template t charts/hackler-operator -n hackler-system > /dev/null
          kubectl kustomize kustomize/base > /dev/null
          kubectl kustomize kustomize/example > /dev/null
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/chart-v')
        run: |
          v="${GITHUB_REF_NAME#chart-v}"
          test "$v" = "$(yq '.version' charts/hackler-operator/Chart.yaml)" || { echo "tag $v does not match Chart.yaml"; exit 1; }
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/hackler-operator
          helm push "hackler-operator-$v.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
