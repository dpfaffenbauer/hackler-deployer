apiVersion: apps/v1
kind: Deployment
metadata:
  name: hackler-operator
  namespace: hackler-system
  labels: { app.kubernetes.io/name: hackler-operator }
spec:
  replicas: 1
  # Never two operators at once: they would race for the same machines.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: hackler-operator }
  template:
    metadata:
      labels: { app.kubernetes.io/name: hackler-operator }
    spec:
      serviceAccountName: hackler-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: operator
          image: ghcr.io/dpfaffenbauer/hackler-operator:sha-3b97304286df
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: hackler-operator }
            - secretRef: { name: hackler-operator }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
